<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .container{
            margin-top:40px;
        }

        h2{
            color:#0d6efd;
            margin-bottom:20px;
        }

        .card{
            margin-bottom:20px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        table{
            background:white;
        }

    </style>

</head>

<body>

<div class="container">

    <h2 class="text-center">Admin Dashboard</h2>

    <!-- Total Users Card -->
    <div class="card">
        <div class="card-body">
            <h4>Total Registered Users:
                <span class="text-primary">{{ total_users }}</span>
            </h4>
        </div>
    </div>

    <!-- Search Form -->
    <form method="GET" action="/admin" class="row mb-4">

        <div class="col-md-10">
            <input
                type="text"
                class="form-control"
                name="search"
                placeholder="Search by Name or Email"
                value="{{ request.args.get('search','') }}">
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary w-100">
                Search
            </button>
        </div>

    </form>

    <!-- User Table -->
    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">

        <tr>
            <th>S.No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Password</th>
        </tr>

        </thead>

        <tbody>

        {% if users %}

            {% for user in users %}

            <tr>

                <td>{{ loop.index }}</td>

                <td>{{ user.name }}</td>

                <td>{{ user.email }}</td>

                <td>{{ user.password }}</td>

            </tr>

            {% endfor %}

        {% else %}

            <tr>

                <td colspan="4" class="text-center text-danger">
                    No Users Found
                </td>

            </tr>

        {% endif %}

        </tbody>

    </table>

    <div class="text-center">

        <a href="/" class="btn btn-secondary">
            Back to Home
        </a>

    </div>

</div>

</body>
</html>

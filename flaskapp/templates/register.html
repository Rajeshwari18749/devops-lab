<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .container-box{

            width:450px;
            margin:60px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.2);

        }

        h2{

            text-align:center;
            color:#198754;
            margin-bottom:25px;

        }

        .btn{

            width:100%;
            font-size:18px;

        }

    </style>

</head>

<body>

<div class="container-box">

<h2>User Registration</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">Name</label>

<input
type="text"
class="form-control"
name="name"
placeholder="Enter Name"
required>

</div>

<div class="mb-3">

<label class="form-label">Email</label>

<input
type="email"
class="form-control"
name="email"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<input
type="password"
class="form-control"
name="password"
placeholder="Enter Password"
required>

</div>

<button
type="submit"
class="btn btn-success">

Register

</button>

</form>

<br>

<a href="/" class="btn btn-secondary">

Back to Home

</a>

</div>

</body>
</html>
